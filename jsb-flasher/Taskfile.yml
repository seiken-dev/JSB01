version: '3'

vars:
  APPNAME: "jsb01-flasher"
  VERSION: "1.0RC5"
  OUTDIR: "bin/Release/net10.0-windows/win-x64/publish"

tasks:
  build:
    desc: Build the flasher executable
    cmds:
      - cp ../Firmware/.pio/build/rpipico/firmware.uf2 ./
      - dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - cp docs/README.txt {{.OUTDIR}}/
      - 7z a {{.OUTDIR}}-{{.VERSION}}.zip {{.OUTDIR}}/*
      - rm firmware.uf2

